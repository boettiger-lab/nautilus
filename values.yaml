hub:
  # Inject OAuth and AWS credentials from K8s secrets into environment
  extraEnv:
    GITHUB_CLIENT_ID:
      valueFrom:
        secretKeyRef:
          name: jupyter-oauth-secret
          key: GITHUB_CLIENT_ID
    GITHUB_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: jupyter-oauth-secret
          key: GITHUB_CLIENT_SECRET
    CILOGON_CLIENT_ID:
      valueFrom:
        secretKeyRef:
          name: jupyter-oauth-secret
          key: CILOGON_CLIENT_ID
    CILOGON_CLIENT_SECRET:
      valueFrom:
        secretKeyRef:
          name: jupyter-oauth-secret
          key: CILOGON_CLIENT_SECRET
    PROXY_SECRET_TOKEN:
      valueFrom:
        secretKeyRef:
          name: jupyter-proxy-secret
          key: PROXY_SECRET_TOKEN
    AWS_ACCESS_KEY_ID:
      valueFrom:
        secretKeyRef:
          name: jupyter-aws-secret
          key: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY:
      valueFrom:
        secretKeyRef:
          name: jupyter-aws-secret
          key: AWS_SECRET_ACCESS_KEY
    OPENAI_API_KEY:
      valueFrom:
        secretKeyRef:
          name: nrp-llm-secret
          key: NRP_LLM_API_KEY
  extraConfig:
    # Read OAuth credentials from environment variables (set via extraEnv from K8s secret)
    configure-oauth-from-env: |
      import os
      c.GitHubOAuthenticator.client_id = os.environ.get('GITHUB_CLIENT_ID')
      c.GitHubOAuthenticator.client_secret = os.environ.get('GITHUB_CLIENT_SECRET')
      c.CILogonOAuthenticator.client_id = os.environ.get('CILOGON_CLIENT_ID')
      c.CILogonOAuthenticator.client_secret = os.environ.get('CILOGON_CLIENT_SECRET')
    # Read proxy secret token from environment variable
    configure-proxy-from-env: |
      import os
      c.ConfigurableHTTPProxy.auth_token = os.environ.get('PROXY_SECRET_TOKEN')
    # Pass secrets from hub env into singleuser pods via KubeSpawner
    configure-singleuser-secrets: |
      import os
      c.KubeSpawner.environment.update({
          'AWS_ACCESS_KEY_ID': os.environ.get('AWS_ACCESS_KEY_ID'),
          'AWS_SECRET_ACCESS_KEY': os.environ.get('AWS_SECRET_ACCESS_KEY'),
          'OPENAI_API_KEY': os.environ.get('OPENAI_API_KEY'),
      })
      c.KubeSpawner.lifecycle_hooks = {
          "postStart": {
              "exec": {
                  "command": ["bash", "-c",
                      # RStudio 2026.05.0 (rocker/ml rebuild 2026-05-31) bakes a
                      # root-owned 0600 session-rpc-key; rootless rserver (via
                      # jupyter-rsession-proxy) can't read it. Make it readable.
                      "sudo chmod a+r /var/lib/rstudio-server/session-rpc-key 2>/dev/null || true; "
                      # Write secrets to ~/.Renviron so RStudio sees them.
                      # Use > (truncate) not >> to avoid appending duplicates on every spawn.
                      "for v in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY OPENAI_API_KEY OPENAI_BASE_URL; do echo \"$v=${!v}\"; done > /home/jovyan/.Renviron"
                  ]
              }
          }
      }
  config:
    GitHubOAuthenticator:
      allowed_organizations:
        - espm-157
        - espm-288
        - boettiger-lab
        - SchmidtDSE
        - berkeley-espm
      scope:
        - read:org
      oauth_callback_url: https://espm.nrp-nautilus.io/hub/oauth_callback
    CILogonOAuthenticator:
      oauth_callback_url: https://espm.nrp-nautilus.io/hub/oauth_callback
      admin_users:
      - cboettig@berkeley.edu
      # NRP-required admin users (per https://nrp.ai/documentation/userdocs/jupyter/jupyterhub/)
      - mfsada@ucsd.edu
      - d4diaz@ucsd.edu
      - dmishin@ucsd.edu
      # IDP Lookup: https://cilogon.org/idplist/
      allowed_idps:
        urn:mace:incommon:berkeley.edu:
          allowed_domains:
          - berkeley.edu
          username_derivation:
            username_claim: email
        # UCSD required so NRP admins can authenticate
        urn:mace:incommon:ucsd.edu:
          allowed_domains:
          - ucsd.edu
          username_derivation:
            username_claim: email
    JupyterHub:
      admin_access: true
      admin_users:
        - "cboettig@berkeley.edu"
        # NRP-required admin users
        - "mfsada@ucsd.edu"
        - "d4diaz@ucsd.edu"
        - "dmishin@ucsd.edu"
      authenticator_class: cilogon
    KubeSpawner:
      environment:
        SHELL: /usr/bin/bash
        GH_SCOPED_CREDS_CLIENT_ID: "Iv1.8d384d9612c2ecc3"
        GH_SCOPED_CREDS_APP_URL: "https://github.com/apps/jupyterhub-gh-creds"
        OPENAI_BASE_URL: "https://ellm.nrp-nautilus.io/v1"
        LANG: "C.UTF-8"
        LC_ALL: "C.UTF-8"

  service:
    type: ClusterIP
    annotations: {}
    ports:
      nodePort:
    loadBalancerIP:
  deploymentStrategy:
    type: Recreate
  db:
    type: sqlite-pvc
    pvc:
      # TEMPORARY PVC SWAP to unblock deployment, 2026-01-25
      # Old PVC hub-db-dir is stuck in ContainerCreating due to Ceph mount issue.
      # DO NOT DELETE the old volume; data not migrated. To revert: return size to 10Gi below.
      accessModes:
        - ReadWriteOnce
      storage: 11Gi
      storageClassName: rook-ceph-block
  resources:
    limits:
      cpu: 2
      memory: 4Gi
    requests:
      cpu: 2 
      memory: 512Mi
  networkPolicy:
    enabled: false
proxy:
  service:
    type: ClusterIP
  chp:
    resources:
      limits:
        cpu: "10"
        memory: 10Gi
      requests:
        cpu: "2"
        memory: 512Mi
singleuser:
  allowPrivilegeEscalation: true
  startTimeout: 3600
  fsGid: 100
  extraPodConfig:
    securityContext:
      fsGroupChangePolicy: "OnRootMismatch"
      fsGroup: 100
  extraNodeAffinity:
    required:
      - matchExpressions:
          - key: topology.kubernetes.io/region
            operator: In
            values: ["us-west"]
  cloudMetadata:
    blockWithIptables: false
  networkPolicy:
    enabled: false
  storage:
    type: dynamic
    extraLabels: {}
    capacity: 15Gi
    homeMountPath: /home/jovyan
    dynamic:
      storageClass: rook-ceph-block
      pvcNameTemplate: claim-{username}{servername}
      volumeNameTemplate: volume-{username}{servername}
      storageAccessModes: [ReadWriteOnce]
    extraVolumeMounts:
      - name: shm-volume
        mountPath: /dev/shm
    extraVolumes:
      - name: shm-volume
        emptyDir:
          medium: Memory
  extraFiles:
    jupyter_server_config.json:
        mountPath: /usr/local/etc/jupyter/jupyter_server_config.json
        data:
          ContentsManager:
            allow_hidden: true
          FileContentsManager:
            always_delete_dir: true
    # Point Kilo Code (kilocode.kilo-code, shipped in rocker/ml's
    # vscode-extensions.txt) at the NRP endpoint. Its baked defaults are
    # providerID "kilo" / model "kilo-auto/free" -- Kilo's own cloud gateway,
    # which demands a personal sign-in -- so without this users cannot use it.
    #
    # Two halves, because Kilo splits them: the agent engine reads providers from
    # a kilo.json config file, but which provider/model a *new session* opens on
    # is VS Code settings state.
    #
    # Deliberately here rather than upstream in rocker/ml: generic `docker run`
    # users of that image should get no NRP default.
    #
    # This loads from /usr/local/etc/jupyter (after /etc/jupyter), so it runs
    # after the base image's own hook -- which still writes the dead
    # roo-cline.autoImportSettingsPath key. Roo Code was swapped out for Kilo
    # Code in rocker-org/ml@ccb58507 (2026-07-16) and install_llms.sh was never
    # updated, so nothing reads that key any more. Drop it as we go.
    #
    # NB: the provider config cannot ride in singleuser env vars -- KubeSpawner
    # runs str.format() over every env value to expand {username}, so JSON braces
    # raise KeyError and every spawn fails.
    jupyter_server_config.py:
        mountPath: /usr/local/etc/jupyter/jupyter_server_config.py
        stringData: |
          """Hub-only Kilo Code defaults: open new sessions on NRP, not Kilo Gateway."""
          import json, logging, os, pathlib

          logger = logging.getLogger(__name__)

          # Kilo Code 7.x replaced Roo's settings-import mechanism with an
          # opencode-style config (its CLI is a fork of opencode), so this is the
          # same schema install_llms.sh writes for opencode. Written per-pod under
          # /tmp rather than into the home PVC so it cannot go stale: every spawn
          # gets the current provider list. A user's own ./kilo.json still wins --
          # project config outranks KILO_CONFIG in Kilo's precedence order.
          #
          # {env:OPENAI_API_KEY} is resolved by Kilo at read time (KILO_CONFIG
          # paths are trusted for interpolation), so the key stays in
          # nrp-llm-secret and is never written to disk.
          KILO_CONFIG_PATH = pathlib.Path("/tmp/kilo/kilo.json")
          KILO_CONFIG = {
              "model": "nrp/deepseek-v4-flash",
              "provider": {
                  "nrp": {
                      "npm": "@ai-sdk/openai-compatible",
                      "name": "NRP",
                      "options": {
                          "baseURL": "https://ellm.nrp-nautilus.io/v1",
                          "apiKey": "{env:OPENAI_API_KEY}",
                      },
                      "models": {
                          # context/output below are Kilo's context-management
                          # budget, not the endpoint's ceiling. Measured
                          # max_model_len on ellm.nrp-nautilus.io 2026-08-22:
                          # deepseek-v4-flash 1048576, qwen3 1010000,
                          # glm-5 300000, minimax-m2 204800, kimi 131072.
                          # Capped at 256k so a long session compacts instead of
                          # resending a million tokens of prefill per turn on
                          # shared cluster GPUs. Raise if a class needs it.
                          "deepseek-v4-flash": {"name": "DeepSeek V4 Flash",
                                                "limit": {"context": 262144, "output": 32768}},
                          "qwen3": {"name": "Qwen3",
                                    "limit": {"context": 262144, "output": 32768}},
                          "glm-5": {"name": "GLM-5",
                                    "limit": {"context": 262144, "output": 32768}},
                          "minimax-m2": {"name": "MiniMax M2",
                                         "limit": {"context": 204800, "output": 32768}},
                          "kimi": {"name": "Kimi",
                                   "limit": {"context": 131072, "output": 16384}},
                      },
                  }
              },
          }

          VSCODE_DEFAULTS = {
              "kilo-code.new.model.providerID": "nrp",
              "kilo-code.new.model.modelID": "deepseek-v4-flash",
              # Inline autocomplete only accepts kilo/mistral/inception as a
              # provider -- there is no way to route it at NRP -- so leave it off
              # rather than have it prompt every user to sign in to Kilo Gateway.
              "kilo-code.new.autocomplete.enableAutoTrigger": False,
          }

          def _write_kilo_config():
              KILO_CONFIG_PATH.parent.mkdir(parents=True, exist_ok=True)
              KILO_CONFIG_PATH.write_text(json.dumps(KILO_CONFIG, indent=2))
              # code-server and any terminal inherit the jupyter server env, which
              # is how the base image also hands OPENCODE_CONFIG to opencode.
              os.environ.setdefault("KILO_CONFIG", str(KILO_CONFIG_PATH))

          def _write_vscode_settings():
              settings = pathlib.Path.home() / ".local/share/code-server/User/settings.json"
              settings.parent.mkdir(parents=True, exist_ok=True)
              try:
                  current = json.loads(settings.read_text()) if settings.exists() else {}
              except Exception:
                  current = {}
              # Only seed keys the user has not set themselves, so a student who
              # switches models in the UI keeps their choice across restarts.
              merged = dict(current)
              for key, value in VSCODE_DEFAULTS.items():
                  merged.setdefault(key, value)
              merged.pop("roo-cline.autoImportSettingsPath", None)
              if merged != current:
                  settings.write_text(json.dumps(merged, indent=2))

          for step in (_write_kilo_config, _write_vscode_settings):
              try:
                  step()
              except Exception as exc:
                  logger.error(f"Kilo Code setup ({step.__name__}) failed: {exc}")
  image:
    name: gitlab-registry.nrp-nautilus.io/cboettig/images
    pullPolicy: IfNotPresent
  cpu:
    limit: 10
    guarantee: 1
  memory:
    limit: 10G
    guarantee: 10G
  profileList:
  - display_name: "Choose your environment and resources"
    default: true
    profile_options:
      interface:
        display_name: Interface
        choices:
          vscode:
            display_name: VS Code
            kubespawner_override:
              default_url: "/vscode"
          rstudio:
            display_name: RStudio
            default: true
            kubespawner_override:
              default_url: "/rstudio"
          lab:
            display_name: JupyterLab
            kubespawner_override:
              default_url: "/lab"
      image:
        display_name: Environment
        unlisted_choice:
          enabled: True
          display_name: "Custom image"
          display_name_in_choices: "Specify an existing docker image"
          description_in_choices: "Use a pre-existing docker image from a public docker registry"
          description: "Specify your own docker image (must have jupyterhub-singleuser installed)"
          validation_regex: "^.+:.+$"
          validation_message: "Must be a publicly available docker image, of form <image-name>:<tag>"
          kubespawner_override:
            image: "{value}"
        choices:
          01-rocker-ml:
            display_name: rocker/ml (CPU)
            description: Machine Learning environment for R & python (rocker/ml)
            kubespawner_override:
              image: "ghcr.io/boettiger-lab/k8s@sha256:192df82b92bf4241d6d252075d53000d71db45b56269efb6624ab3bfa988f973"
            default: true
          02-speciesnet:
            display_name: SpeciesNet (GPU)
            description: CV/ML for ecology
            kubespawner_override:
              image: "ghcr.io/boettiger-lab/speciesnet:latest"
              extra_resource_limits:
                nvidia.com/gpu: "1"
          03-rocker-cuda:
            display_name: rocker/cuda (GPU)
            description: Machine Learning environment for R & python
            kubespawner_override:
              image: "ghcr.io/rocker-org/cuda:latest"
              extra_resource_limits:
                nvidia.com/gpu: "1"
          04-geospatial:
            display_name: Rocker ML spatial
            description: Geospatial environment for R & python (rocker/ml-spatial)
            kubespawner_override:
              image: "ghcr.io/rocker-org/ml-spatial:latest"

      resource_allocation:
        display_name: Resource Allocation
        choices:
          mem_8:
            display_name: 8 GB RAM
            kubespawner_override:
              mem_guarantee: 8G
              mem_limit: 8G
              cpu_guarantee: 1
              cpu_limit: 1
            default: true
          mem_16:
            display_name: 16 GB RAM
            kubespawner_override:
              mem_guarantee: 16G
              mem_limit: 16G
              cpu_guarantee: 2
              cpu_limit: 2
          mem_32:
            display_name: 32 GB RAM
            kubespawner_override:
              mem_guarantee: 32G
              mem_limit: 32G
              cpu_guarantee: 4
              cpu_limit: 4
          mem_64:
            display_name: 64 GB RAM
            kubespawner_override:
              mem_guarantee: 64G
              mem_limit: 64G
              cpu_guarantee: 10
              cpu_limit: 10
          mem_128:
            display_name: 128 GB RAM
            kubespawner_override:
              mem_guarantee: 128G
              mem_limit: 128G
              cpu_guarantee: 10
              cpu_limit: 10



scheduling:
  userScheduler:
    enabled: false
  userPlaceholder:
    enabled: false
# prePuller relates to the hook|continuous-image-puller DaemonsSets
prePuller:
  hook:
    enabled: false 
  continuous:
    enabled: false

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: haproxy
  hosts: ["espm.nrp-nautilus.io"]
  pathSuffix: ''
  tls:
    - hosts:
      - espm.nrp-nautilus.io

cull:
  enabled: true
  users: false
  removeNamedServers: true
  timeout: 3600
  every: 600
  concurrency: 10
  maxAge: 0
